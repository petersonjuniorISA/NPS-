name: Atualiza dados do NPS

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (~06:00 horário de Brasília)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Busca dados no Databricks
        run: python scripts/fetch_databricks.py
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_TABLE: ${{ secrets.DATABRICKS_TABLE }}

      - name: Publica data/nps.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nps.json
          git diff --cached --quiet && echo "Sem mudanças novas." || git commit -m "chore: atualiza dados do NPS"
          git push
